---
# Prometheus Alerting Rules — PA System
# Covers: SLA violations, service health, AI accuracy, HIPAA audit triggers

groups:
- name: pa_system_sla
  interval: 30s
  rules:

  - alert: SLABreachImminent
    expr: |
      pa_cases_sla_hours_remaining{status=~"SUBMITTED|IN_REVIEW|PENDING_INFO"} < 4
    for: 0m
    labels:
      severity: critical
      team: clinical-ops
    annotations:
      summary: "PA case {{ $labels.pa_number }} SLA breach in {{ $value }}h"
      description: "Case {{ $labels.pa_number }} (urgency={{ $labels.urgency }}) has {{ $value }} hours until regulatory deadline."
      runbook: "https://wiki.pa-system.health/runbooks/sla-breach"

  - alert: SLAComplianceBelowTarget
    expr: |
      (sum(pa_decisions_total{sla_compliant="true"}) / sum(pa_decisions_total)) * 100 < 95
    for: 15m
    labels:
      severity: warning
      team: clinical-ops
    annotations:
      summary: "SLA compliance {{ $value }}% — below 95% target"
      description: "Rolling SLA compliance has dropped to {{ $value }}%. Regulatory target is 95%."

  - alert: OpenCasesAboveCapacity
    expr: pa_queue_depth{status="IN_REVIEW"} > 500
    for: 5m
    labels:
      severity: warning
      team: clinical-ops
    annotations:
      summary: "Review queue depth {{ $value }} cases"

- name: pa_system_api
  interval: 15s
  rules:

  - alert: APIHighErrorRate
    expr: |
      rate(kong_http_requests_total{status=~"5.."}[5m])
      / rate(kong_http_requests_total[5m]) > 0.02
    for: 2m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "API error rate {{ $value | humanizePercentage }} on {{ $labels.service }}"
      description: "Service {{ $labels.service }} has >2% error rate for 2 minutes."
      runbook: "https://wiki.pa-system.health/runbooks/api-errors"

  - alert: APILatencyHigh
    expr: |
      histogram_quantile(0.95,
        rate(kong_request_latency_ms_bucket[5m])
      ) > 500
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "API p95 latency {{ $value }}ms > 500ms SLA on {{ $labels.service }}"

  - alert: ServiceDown
    expr: up{job=~"ai-engine|intake-service|payer-integration|appeals-service|notification-service|document-service"} == 0
    for: 1m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "Service {{ $labels.job }} is DOWN"
      description: "{{ $labels.job }} has been unreachable for 1 minute."
      runbook: "https://wiki.pa-system.health/runbooks/service-down"

  - alert: PodCrashLooping
    expr: rate(kube_pod_container_status_restarts_total{namespace="pa-system"}[15m]) * 60 > 3
    for: 5m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "Pod {{ $labels.pod }} crash looping ({{ $value }} restarts/min)"

- name: pa_system_ai
  interval: 60s
  rules:

  - alert: AIAccuracyBelowTarget
    expr: pa_ai_accuracy_7d < 0.92
    for: 30m
    labels:
      severity: warning
      team: ml-platform
    annotations:
      summary: "AI accuracy {{ $value | humanizePercentage }} — below 92% target"
      description: "7-day rolling AI accuracy has fallen to {{ $value }}. Model retraining may be needed."

  - alert: AIAutoApprovalRateLow
    expr: |
      (sum(pa_decisions_total{decision="AUTO_APPROVED"}) /
       sum(pa_decisions_total)) * 100 < 60
    for: 1h
    labels:
      severity: warning
      team: ml-platform
    annotations:
      summary: "Auto-approval rate {{ $value }}% — below 70% KPI target"

  - alert: AIInferenceLatencyHigh
    expr: |
      histogram_quantile(0.95,
        rate(pa_ai_inference_duration_seconds_bucket[10m])
      ) > 5
    for: 5m
    labels:
      severity: warning
      team: ml-platform
    annotations:
      summary: "AI inference p95 {{ $value }}s > 5s SLA"

  - alert: AIEngineQueueBacklog
    expr: pa_ai_queue_depth > 100
    for: 5m
    labels:
      severity: warning
      team: ml-platform
    annotations:
      summary: "AI queue backlog {{ $value }} cases"

- name: pa_system_infrastructure
  interval: 30s
  rules:

  - alert: DatabaseConnectionsHigh
    expr: |
      pg_stat_database_numbackends{datname="pa_system"}
      / pg_settings_max_connections > 0.80
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "PostgreSQL connections at {{ $value | humanizePercentage }} of max"

  - alert: DatabaseReplicationLag
    expr: pg_replication_lag_seconds > 30
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "RDS replication lag {{ $value }}s"

  - alert: RedisMemoryHigh
    expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Redis memory at {{ $value | humanizePercentage }}"

  - alert: KafkaConsumerLag
    expr: kafka_consumer_lag_sum{topic=~"pa-submissions|pa-decisions"} > 1000
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Kafka consumer lag {{ $value }} on {{ $labels.topic }}"

  - alert: DiskSpaceLow
    expr: |
      (node_filesystem_avail_bytes{mountpoint="/"} /
       node_filesystem_size_bytes{mountpoint="/"}) < 0.15
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Node {{ $labels.node }} disk {{ $value | humanizePercentage }} free"

- name: pa_system_hipaa
  interval: 60s
  rules:

  - alert: UnusualPHIAccessRate
    expr: |
      rate(pa_audit_phi_access_total[5m]) > 50
    for: 2m
    labels:
      severity: critical
      team: security
    annotations:
      summary: "Unusual PHI access rate {{ $value }} req/s — possible data exfiltration"
      description: "PHI access rate has exceeded 50 req/s for 2 minutes. Investigate immediately."
      runbook: "https://wiki.pa-system.health/runbooks/phi-access-anomaly"

  - alert: MultipleFailedLogins
    expr: |
      rate(pa_auth_failed_total[5m]) * 300 > 10
    for: 1m
    labels:
      severity: warning
      team: security
    annotations:
      summary: "{{ $value }} failed logins in 5 minutes from {{ $labels.ip }}"

  - alert: AuditLogIngestionStopped
    expr: rate(pa_audit_log_entries_total[5m]) == 0
    for: 10m
    labels:
      severity: critical
      team: security
    annotations:
      summary: "HIPAA audit log ingestion has stopped for 10 minutes"
