version: "3.9"

services:
  ai-engine:
    build: .
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://pauser:papass@postgres:5432/pa_system
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENVIRONMENT: development
      SECRET_KEY: dev-secret-change-in-production-min-32-chars
      ENCRYPTION_KEY: dev-enc-key-32bytes-change-prod!!
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ./app:/app/app   # Hot reload in dev

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pa_system
      POSTGRES_USER: pauser
      POSTGRES_PASSWORD: papass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  redis_data:
