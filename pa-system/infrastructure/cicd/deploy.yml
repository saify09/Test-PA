name: PA System — CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: pa-system-production-eks

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Backend Tests
# AI engine: working-directory=ai-engine, PYTHONPATH=.
# Microservices: working-directory=repo root, PYTHONPATH=.
#   Tests import "from microservices.intake_service.app.main import app"
#   which resolves via microservices/intake_service/app/main.py (underscore aliases)
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pa_system_test
          POSTGRES_USER: pauser
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install AI engine dependencies
      run: |
        pip install --upgrade pip
        # Install core deps without heavy ML libraries (use stubs in test env)
        pip install fastapi uvicorn[standard] pydantic pydantic-settings \
          python-jose[cryptography] passlib[bcrypt] python-multipart httpx \
          sqlalchemy asyncpg alembic redis aiokafka boto3 cryptography \
          structlog prometheus-fastapi-instrumentator python-dateutil \
          tenacity aiofiles jinja2 python-decouple fhir.resources hl7 \
          pytest pytest-asyncio pytest-timeout httpx

    - name: Run AI engine tests
      working-directory: ai-engine
      env:
        DATABASE_URL: postgresql+asyncpg://pauser:testpass@localhost:5432/pa_system_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-32-chars-minimum!!
        ENCRYPTION_KEY: test-enc-key-32bytes-for-testing!!
        PYTHONPATH: .
      run: pytest tests/ -v --tb=short --timeout=60

    - name: Install microservices dependencies
      run: |
        for svc in intake-service payer-integration appeals-service notification-service document-service; do
          pip install -r microservices/$svc/requirements.txt || true
        done

    - name: Run microservices tests
      env:
        DATABASE_URL: postgresql+asyncpg://pauser:testpass@localhost:5432/pa_system_test
        REDIS_URL: redis://localhost:6379/0
        ENVIRONMENT: test
        SECRET_KEY: test-secret-key-32-chars-minimum!!
        ENCRYPTION_KEY: test-enc-key-32bytes-for-testing!!
        PYTHONPATH: .
      run: pytest microservices/tests/ -v --tb=short --timeout=60

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: "**/.pytest_cache"

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Frontend Tests (type-check + build)
# Uses npm install (not npm ci) — no package-lock.json committed to repo.
# ──────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: "Frontend: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [provider-portal, reviewer-workbench, member-portal, admin-dashboard]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: ${{ matrix.app }}/package.json

    - name: Install dependencies
      working-directory: ${{ matrix.app }}
      run: npm install --legacy-peer-deps

    - name: Type check
      working-directory: ${{ matrix.app }}
      run: npx tsc --noEmit

    - name: Lint (non-blocking)
      working-directory: ${{ matrix.app }}
      run: npx next lint --dir . || true

    - name: Build
      working-directory: ${{ matrix.app }}
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_TELEMETRY_DISABLED: "1"
        NODE_ENV: production
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-${{ matrix.app }}
        path: ${{ matrix.app }}/.next/standalone
        retention-days: 7

# ──────────────────────────────────────────────────────────────────────────────
# JOB 3 — Security Scanning (non-blocking)
# ──────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit (Python SAST)
      run: |
        pip install bandit
        bandit -r ai-engine/app \
               microservices/intake-service/app \
               microservices/payer-integration/app \
               microservices/appeals-service/app \
               microservices/notification-service/app \
               microservices/document-service/app \
               -f json -o bandit-report.json || true

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: "."
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        ignore-unfixed: true
      continue-on-error: true

    - name: Upload Trivy SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif
      continue-on-error: true

    - name: Secret scan (gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

# ──────────────────────────────────────────────────────────────────────────────
# JOB 4 — Build & Push Docker Images to ECR
# Only on push to main or staging.
# context paths are relative to repo root.
# ──────────────────────────────────────────────────────────────────────────────
  build-images:
    name: "Build: ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    strategy:
      fail-fast: false
      matrix:
        service:
        - { name: ai-engine,           context: ai-engine }
        - { name: intake-service,      context: microservices/intake-service }
        - { name: payer-integration,   context: microservices/payer-integration }
        - { name: appeals-service,     context: microservices/appeals-service }
        - { name: notification-service,context: microservices/notification-service }
        - { name: document-service,    context: microservices/document-service }
        - { name: provider-portal,     context: provider-portal }
        - { name: reviewer-workbench,  context: reviewer-workbench }
        - { name: member-portal,       context: member-portal }
        - { name: admin-dashboard,     context: admin-dashboard }

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Compute image tag
      id: tag
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        ENV="staging"
        if [ "$GITHUB_REF_NAME" = "main" ]; then ENV="production"; fi
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "env=$ENV"             >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.service.name }}
      uses: docker/build-push-action@v5
      with:
        context:  ${{ matrix.service.context }}
        file:     ${{ matrix.service.context }}/Dockerfile
        push:     true
        tags: |
          ${{ env.ECR_REGISTRY }}/pa-system/${{ matrix.service.name }}:${{ steps.tag.outputs.short_sha }}
          ${{ env.ECR_REGISTRY }}/pa-system/${{ matrix.service.name }}:${{ steps.tag.outputs.env }}-latest
        cache-from: type=gha,scope=${{ matrix.service.name }}
        cache-to:   type=gha,mode=max,scope=${{ matrix.service.name }}
        build-args: |
          BUILD_VERSION=${{ steps.tag.outputs.short_sha }}
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=https://api.pa-system.health

    - name: Scan image (warn only)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/pa-system/${{ matrix.service.name }}:${{ steps.tag.outputs.short_sha }}
        format: table
        exit-code: "0"
        severity: CRITICAL
        ignore-unfixed: true

# ──────────────────────────────────────────────────────────────────────────────
# JOB 5 — Deploy to Staging
# ──────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://portal.staging.pa-system.health

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name pa-system-staging-eks

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: "3.14.0"

    - name: Deploy to staging
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        helm upgrade --install pa-system ./infrastructure/helm/pa-system \
          --namespace pa-system \
          --create-namespace \
          --set global.imageTag=$SHORT_SHA \
          --set global.imageRegistry=${{ env.ECR_REGISTRY }}/pa-system \
          --set global.environment=staging \
          --values ./infrastructure/helm/pa-system/values-staging.yaml \
          --wait --timeout 10m \
          --atomic

    - name: Smoke test
      run: |
        kubectl wait --for=condition=ready pod -l app=ai-engine \
          -n pa-system --timeout=120s
        for i in $(seq 1 5); do
          curl -sf https://api.staging.pa-system.health/health && break
          sleep 15
        done

# ──────────────────────────────────────────────────────────────────────────────
# JOB 6 — Deploy to Production (canary → promote)
# ──────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://portal.pa-system.health

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region:            ${{ env.AWS_REGION }}

    - name: Update kubeconfig
      run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: "3.14.0"

    - name: Run DB migrations
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        kubectl run db-migrate-${GITHUB_RUN_ID} \
          --image=${{ env.ECR_REGISTRY }}/pa-system/ai-engine:$SHORT_SHA \
          --restart=Never \
          --namespace=pa-system \
          --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
          --command -- python -m alembic upgrade head
        kubectl wait pod/db-migrate-${GITHUB_RUN_ID} \
          --for=condition=ready -n pa-system --timeout=60s || true
        kubectl logs pod/db-migrate-${GITHUB_RUN_ID} -n pa-system || true
        kubectl delete pod db-migrate-${GITHUB_RUN_ID} -n pa-system --ignore-not-found

    - name: Deploy canary (20%)
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        helm upgrade --install pa-system ./infrastructure/helm/pa-system \
          --namespace pa-system \
          --create-namespace \
          --set global.imageTag=$SHORT_SHA \
          --set global.imageRegistry=${{ env.ECR_REGISTRY }}/pa-system \
          --set global.environment=production \
          --set ai-engine.canary.enabled=true \
          --set ai-engine.canary.weight=20 \
          --values ./infrastructure/helm/pa-system/values-production.yaml \
          --wait --timeout 15m

    - name: Monitor canary (5 min)
      run: |
        echo "Monitoring canary for 5 minutes..."
        sleep 300
        # Query Prometheus for 5xx error rate
        PROM_POD=$(kubectl get pod -n monitoring -l app.kubernetes.io/name=prometheus \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
        ERROR_RATE="0"
        if [ -n "$PROM_POD" ]; then
          ERROR_RATE=$(kubectl exec -n monitoring $PROM_POD -- \
            wget -qO- "http://localhost:9090/api/v1/query?query=rate(kong_http_requests_total{status%3D~'5..'}[5m])%2Frate(kong_http_requests_total[5m])" \
            2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d['data']['result']; print(r[0]['value'][1] if r else '0')" \
            || echo "0")
        fi
        echo "5xx error rate: $ERROR_RATE"
        python3 -c "
rate = float('$ERROR_RATE')
if rate > 0.05:
    print(f'FAIL: error rate {rate:.2%} > 5% threshold')
    exit(1)
print(f'OK: error rate {rate:.2%} within threshold')
"

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Rolling back deployment..."
        helm rollback pa-system --namespace pa-system --wait || true

    - name: Promote to 100%
      if: success()
      run: |
        SHORT_SHA="${GITHUB_SHA::8}"
        helm upgrade pa-system ./infrastructure/helm/pa-system \
          --namespace pa-system \
          --set global.imageTag=$SHORT_SHA \
          --set global.imageRegistry=${{ env.ECR_REGISTRY }}/pa-system \
          --set global.environment=production \
          --set ai-engine.canary.enabled=false \
          --values ./infrastructure/helm/pa-system/values-production.yaml \
          --wait --timeout 15m

    - name: Notify success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: "✅ PA System ${{ github.sha }} deployed to production"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: "🚨 PA System production deploy FAILED — ${{ github.sha }}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
