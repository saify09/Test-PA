global:
  imageTag: latest
  environment: production
  imageRegistry: ""   # Set to your ECR registry: 123456789.dkr.ecr.us-east-1.amazonaws.com/pa-system

# ── Service replicas (production) ────────────────────────────────
ai-engine:
  replicas: 2
  canary:
    enabled: false
    weight: 0
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "4Gi" }

intake-service:
  replicas: 3
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

payer-integration:
  replicas: 2
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1000m", memory: "1Gi" }

appeals-service:
  replicas: 2
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits:   { cpu: "750m", memory: "1Gi" }

notification-service:
  replicas: 2
  resources:
    requests: { cpu: "150m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

document-service:
  replicas: 2
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits:   { cpu: "2000m", memory: "4Gi" }

provider-portal:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

reviewer-workbench:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

member-portal:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

admin-dashboard:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# ── Ingress ───────────────────────────────────────────────────────
ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ""   # Set your ACM cert ARN
  hosts:
    provider:  portal.pa-system.health
    reviewer:  reviewer.pa-system.health
    member:    member.pa-system.health
    admin:     admin.pa-system.health
    api:       api.pa-system.health
