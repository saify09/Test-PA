---
# namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: pa-system
  labels:
    name: pa-system
    environment: production
    hipaa-compliant: "true"
---
# configmap-common.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: pa-common-config
  namespace: pa-system
data:
  ENVIRONMENT: "production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-headless.pa-system.svc.cluster.local:9092"
  REDIS_URL: "redis://redis-master.pa-system.svc.cluster.local:6379/0"
  AI_ENGINE_URL: "http://ai-engine.pa-system.svc.cluster.local:8001"
  INTAKE_SERVICE_URL: "http://intake-service.pa-system.svc.cluster.local:8002"
  PAYER_INTEGRATION_URL: "http://payer-integration.pa-system.svc.cluster.local:8003"
  APPEALS_SERVICE_URL: "http://appeals-service.pa-system.svc.cluster.local:8004"
  NOTIFICATION_SERVICE_URL: "http://notification-service.pa-system.svc.cluster.local:8005"
  DOCUMENT_SERVICE_URL: "http://document-service.pa-system.svc.cluster.local:8006"
  LOG_LEVEL: "INFO"
  ENABLE_KAFKA: "true"
  ENABLE_AUTO_APPROVE: "true"
  ENABLE_AUTO_DENY: "false"
  AUTO_APPROVE_THRESHOLD: "0.92"
  AUTO_DENY_THRESHOLD: "0.15"
  SESSION_TTL_SECONDS: "900"
  JWT_EXPIRE_MINUTES: "15"
---
# secrets-template.yaml  (values injected by Sealed Secrets / AWS Secrets Manager)
apiVersion: v1
kind: Secret
metadata:
  name: pa-secrets
  namespace: pa-system
  annotations:
    # Production: use sealed-secrets or external-secrets operator
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_SEALED_SECRET"
  ENCRYPTION_KEY: "REPLACE_WITH_SEALED_SECRET"
  DATABASE_URL: "REPLACE_WITH_SEALED_SECRET"
  REDIS_PASSWORD: "REPLACE_WITH_SEALED_SECRET"
  UHC_CLIENT_ID: "REPLACE_WITH_SEALED_SECRET"
  UHC_CLIENT_SECRET: "REPLACE_WITH_SEALED_SECRET"
  AETNA_CLIENT_ID: "REPLACE_WITH_SEALED_SECRET"
  AETNA_CLIENT_SECRET: "REPLACE_WITH_SEALED_SECRET"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_SEALED_SECRET"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_SEALED_SECRET"
  SENDGRID_API_KEY: "REPLACE_WITH_SEALED_SECRET"
  TWILIO_AUTH_TOKEN: "REPLACE_WITH_SEALED_SECRET"
