# Grafana Dashboard Provisioning — PA System
# Place in grafana/provisioning/dashboards/pa-system.yml

apiVersion: 1

providers:
  - name: PA System Dashboards
    orgId: 1
    folder: "PA System"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
