global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: development
    system: pa-authorization

rule_files:
  - "alerts.yaml"

scrape_configs:
  - job_name: "ai-engine"
    static_configs: [{targets: ["ai-engine:8001"]}]
    metrics_path: /metrics

  - job_name: "intake-service"
    static_configs: [{targets: ["intake-service:8002"]}]
    metrics_path: /metrics

  - job_name: "payer-integration"
    static_configs: [{targets: ["payer-integration:8003"]}]
    metrics_path: /metrics

  - job_name: "appeals-service"
    static_configs: [{targets: ["appeals-service:8004"]}]
    metrics_path: /metrics

  - job_name: "notification-service"
    static_configs: [{targets: ["notification-service:8005"]}]
    metrics_path: /metrics

  - job_name: "document-service"
    static_configs: [{targets: ["document-service:8006"]}]
    metrics_path: /metrics

  - job_name: "auth-service"
    static_configs: [{targets: ["auth-service:8007"]}]
    metrics_path: /metrics

  - job_name: "user-management-service"
    static_configs: [{targets: ["user-management-service:8008"]}]
    metrics_path: /metrics

  - job_name: "reporting-service"
    static_configs: [{targets: ["reporting-service:8009"]}]
    metrics_path: /metrics

  - job_name: "eligibility-service"
    static_configs: [{targets: ["eligibility-service:8010"]}]
    metrics_path: /metrics

  - job_name: "audit-service"
    static_configs: [{targets: ["audit-service:8011"]}]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs: [{targets: ["postgres:5432"]}]
